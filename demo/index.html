<title>魔法少女喵喵队</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* 布局：全屏画布 + 叠加的糖果面板；游戏是单一视觉世界，不随深浅色切换 */
  :root {
    --cream: #fff8f0;
    --pink: #ff7fa8;
    --pink-deep: #d94f7e;
    --mint: #6fd3b5;
    --mint-deep: #2f9c7d;
    --lav: #a98be8;
    --plum: #5b2a45;
    --plum-soft: #8a5772;
    --gold: #ffc23a;

  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--sky);
    color: var(--plum);
    font-family: var(--display);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
  #cv { position: absolute; display: block; touch-action: none; }
  #probe {

  .dim { background: rgba(70, 30, 60, 0.4); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }

  .panel {
    background: var(--cream);
    border: 4px solid #ffd3e2;
    border-radius: 28px;

  .panel h2 { margin: 0; font-weight: 400; font-size: clamp(24px, 7vh, 40px); color: var(--pink-deep); text-wrap: balance; }

  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

    font: inherit; font-size: clamp(17px, 4.4vh, 24px);

    padding: 0.45em 1.4em; min-height: 48px; min-width: 112px;

    background: linear-gradient(#ff9ec0, #ff6f9c);

  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-deep); }

  .chip {
    font: inherit; font-size: 15px; color: var(--plum);

  }
  .link { font: inherit; font-size: 14px; color: var(--plum-soft); background: none; border: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 40px; padding: 0 8px; }

  .icon-btn {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 8px);

    background: linear-gradient(#ffb3cc, #ff7fa8);
    box-shadow: 0 4px 0 var(--pink-deep);

  /* 标题页 */
  .title { justify-content: space-between; gap: 2vw; }

    pointer-events: none;

  .title-left { position: relative; display: flex; flex-direction: column; gap: clamp(8px, 2.6vh, 18px); align-items: flex-start; max-width: 58%; padding-left: 2vw; }
  .kicker { margin: 0; font-size: clamp(14px, 3.6vh, 19px); color: var(--plum-soft); letter-spacing: 0.06em; }
  .logo { margin: 0; font-weight: 400; line-height: 0.95; display: flex; flex-direction: column; }
  .logo .l1 {
    font-size: clamp(26px, 8vh, 52px); color: var(--lav);

  .logo .l2 {
    font-size: clamp(54px, 19vh, 128px); color: var(--pink);
    text-shadow: 4px 0 0 #fff, -4px 0 0 #fff, 0 4px 0 #fff, 0 -4px 0 #fff, 3px 3px 0 #fff, -3px 3px 0 #fff, 3px -3px 0 #fff, -3px -3px 0 #fff, 0 9px 0 var(--pink-deep);

  .fine { margin: 0; font-size: clamp(12px, 3vh, 15px); color: var(--plum-soft); }
  .title-art { position: relative; width: 40%; height: 92%; pointer-events: none; }

  .select { width: min(940px, 100%); display: flex; flex-direction: column; gap: clamp(8px, 2.4vh, 16px); }
  .select header { display: flex; align-items: baseline; justify-content: center; gap: 12px; }
  .cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(6px, 1.4vw, 14px); }
  .card {
    font: inherit; color: var(--plum); cursor: pointer;
    background: #fff; border: 3px solid #ffd3e2; border-radius: 22px;
    padding: clamp(8px, 2.4vh, 16px) 8px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    box-shadow: 0 5px 0 #f4c6d6;
    transition: transform 0.1s;
  }
  .card:active { transform: translateY(3px); }
  .card .num { font-size: clamp(26px, 8vh, 42px); line-height: 1; color: var(--pink); }
  .card .name { font-size: clamp(15px, 4vh, 20px); }
  .card .tag { font-size: 13px; background: #e1f7f0; color: var(--mint-deep); border-radius: 999px; padding: 2px 10px; }
  .card .stars { font-size: 20px; letter-spacing: 2px; color: #e7d9e0; font-family: system-ui, sans-serif; }
  .card .stars b { color: var(--gold); font-weight: 400; }
  .card .best { font-size: 12px; color: var(--plum-soft); font-variant-numeric: tabular-nums; }
  .card.locked { cursor: not-allowed; filter: grayscale(0.85); opacity: 0.55; box-shadow: none; }
  .select footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }

  /* 失败 / 暂停 */
  .fail, .pause { width: min(460px, 100%); display: flex; flex-direction: column; gap: clamp(8px, 2.6vh, 16px); }
  .tip { margin: 0; font-size: clamp(15px, 3.8vh, 19px); line-height: 1.5; color: var(--plum); }
  .easy { margin: 0; font-size: 14px; color: var(--mint-deep); }

  /* 结算 */
  .result { width: min(640px, 100%); display: flex; flex-direction: column; gap: clamp(8px, 2.4vh, 16px); }
  .result-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(12px, 3vw, 28px); align-items: center; text-align: left; }
  .big-stars { display: flex; gap: 4px; font-family: system-ui, sans-serif; }
  .big-stars span { font-size: clamp(34px, 11vh, 56px); line-height: 1; color: #eadbe2; transform: scale(0.6); transition: transform 0.35s cubic-bezier(.3, 1.8, .5, 1), color 0.2s; }
  .big-stars span.on { color: var(--gold); transform: scale(1); text-shadow: 0 3px 0 #e09a10; }
  .big-stars span:nth-child(2) { transform: translateY(-10px) scale(0.6); }
  .big-stars span.on:nth-child(2) { transform: translateY(-10px) scale(1.12); }
  .checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: clamp(14px, 3.6vh, 17px); }
  .checks li { display: flex; gap: 8px; align-items: center; }
  .checks li::before { content: "○"; color: #d8c3cc; width: 1.1em; text-align: center; font-family: system-ui, sans-serif; }
  .checks li.ok::before { content: "✔"; color: var(--mint-deep); }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 6px 0 0; }
  .stats div { background: #fff; border-radius: 14px; padding: 6px 4px; text-align: center; }
  .stats dt { font-size: 12px; color: var(--plum-soft); }
  .stats dd { margin: 0; font-size: clamp(16px, 4.4vh, 22px); font-variant-numeric: tabular-nums; }

  /* 竖屏提示 */
  .rotate { background: var(--sky); flex-direction: column; gap: 16px; text-align: center; }

  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }

  @media (max-height: 420px) {

  @media (max-width: 560px) {

    .result-body { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    #artGirl, #artCat, .rotate .phone { animation: none; }
  }
</style>

        [1660, 1900, '上面的门跳上去，下面的门直接走'], [2250, 2480, '连踩 6 只怪就能拿三星'], [3950, 4260, '这次路牌上是什么图案？']],
    },
    {
      // 复习：二段跳大坑 → 踩★怪解封印 → 8 连踩 → 猫咪搭桥 → 布丁王首领战（站定迎击，3 次踩踏）
      code: '1-5', name: '星光大反击', tag: '小首领', goals: [['combo', 8], ['energy', 80]], finish: null,
      solids: [[0, 800, 440], [1030, 4600, 440], [4920, 7200, 440]],
      plats: [[3300, 100, 400], [3452, 100, 360], [3604, 100, 320], [3756, 100, 280]],
      springs: [],

      enemies: [['jelly', 560], ['pudding', 1450, 440, [1360, 1540]],

        ['jelly', 2700], ['jelly', 2866], ['jelly', 3032], ['jelly', 3198],
        ['jelly', 3350, 400], ['jelly', 3502, 360], ['jelly', 3654, 320], ['jelly', 3806, 280]],
      cat: { stopX: 4540, ventX: 4572, btnX: 4965, bridge: [4600, 320, 440] },

    },
  ];
  const DOOR_LEDGE = 360;

  function buildLevel(d, i) {
    const L = { ...d, idx: i };
    L.solids = d.solids.map(([x0, x1, y], k) => ({ x: x0, y, w: x1 - x0, h: VH + 80 - y, seed: k * 17 + i * 101 }));
    L.plats = d.plats.map(([x, w, y]) => ({ x, y, w }));
    L.springs = d.springs.map(([cx, sy]) => ({ x: cx - 22, y: sy - 16, w: 44, h: 16 }));
    L.enemies = d.enemies.map(([type, cx, sy = GY, patrol, opt = {}]) => {
      const [w, h] = ENEMY_SIZE[type];
      const e = { type, x: cx - w / 2, y: sy - h, w, h, vx: 0, x0: 0, x1: 0, patrol: false, seal: opt.seal ?? -1, minion: false };
      if (patrol) { e.patrol = true; e.vx = -(opt.speed || 35); e.x0 = patrol[0] - w / 2; e.x1 = patrol[1] - w / 2; }
      return e;
    });
    L.stars = d.stars.map(([x, y]) => ({ x, y }));
    L.slow = d.slow || [];
    L.doors = d.doors || [];
    L.seals = (d.seals || []).map(([x, y]) => ({ x, y, w: 28, h: VH + 80 - y }));
    L.boss = d.boss ? { ...d.boss, home: d.boss.stopX + d.boss.homeOff } : null;
    if (d.cat) {
      const [bx, bw, by] = d.cat.bridge;

  }
  const LEVELS = LEVEL_DEFS.map(buildLevel);

  // ===== 模拟（固定步长、无随机数，可被求解器复用） =====
  function newRun(L, easy) {
    const spawn = L.solids[0];
    return {
      n: 0, t: 0,
      p: { x: 60, y: spawn.y - 58, w: 30, h: 58, vy: 0, onGround: true, air: 1, coyote: 0, buf: 0, stompT: 0, inv: 0, hp: CFG.hp, blocked: false },
      en: L.enemies.map((e) => ({ ...e, alive: true })),
      got: new Uint8Array(L.stars.length),
      springT: L.springs.map(() => 9),
      combo: 0, comboT: 0, maxCombo: 0, score: 0, energy: 0, stars: 0, stomps: 0, hurts: 0, perfects: 0,
      cat: { phase: L.cat ? 'idle' : 'none', t: 0 },
      doorDone: new Uint8Array(L.doors.length), doorFailsBy: new Uint8Array(L.doors.length), doorFails: 0,
      seals: new Uint8Array(L.seals.length),
      boss: L.boss ? { state: 'idle', t: 0, hp: 3, phase: 1, x: L.boss.home - 40, y: GY - 62, w: 80, h: 62, spawnLeft: 0 } : null,
      easy: !!easy, dead: false, cause: '', finished: false, ev: [],

  }
  function cloneRun(s) {
    return {
      ...s, p: { ...s.p }, en: s.en.map((e) => ({ ...e })), got: s.got.slice(), springT: s.springT.slice(), cat: { ...s.cat },
      doorDone: s.doorDone.slice(), doorFailsBy: s.doorFailsBy.slice(), seals: s.seals.slice(), boss: s.boss ? { ...s.boss } : null, ev: null,
    };
  }

  // 踩踏成功后的弹起、连击与计分（普通怪与首领共用）
  function stompBounce(s, e, base, energy) {
    const p = s.p;
    const perfect = p.buf > 0;
    p.vy = -CFG.bounceV * (perfect ? CFG.perfectMul : 1);
    p.y = e.y - p.h;
    p.buf = 0;
    p.stompT = perfect ? 0 : CFG.perfectWindow;
    p.onGround = false;
    p.air = Math.max(p.air, CFG.bounceRestore);
    s.combo = s.comboT > 0 ? s.combo + 1 : 1;
    s.comboT = CFG.comboWindow;
    s.maxCombo = Math.max(s.maxCombo, s.combo);
    s.stomps++;
    let sc = base, en = energy;
    const bonus = COMBO_BONUS[s.combo];
    if (bonus) { sc += bonus[0]; en += bonus[1]; }
    if (perfect) { sc += 50; s.perfects++; }
    s.score += sc;
    s.energy += en;
    return { perfect, bonus: !!bonus };
  }
  function hurtPlayer(s, cause) {
    const p = s.p;
    p.hp--; p.inv = CFG.invuln; s.hurts++;
    if (s.combo > 1) emit(s, 'comboEnd', { combo: s.combo });
    s.combo = 0; s.comboT = 0;
    emit(s, 'hurt', { x: p.x + p.w / 2, y: p.y + p.h / 2 });
    if (p.hp <= 0) { s.dead = true; s.cause = cause; }
  }

  // 布丁王：出场 → 放小怪 → 走向主角 →（被踩）击退、生气、进入下一阶段；走过头就跳回原位重来
  function bossStep(L, s, prevBottom, tol) {
    const b = s.boss, B = L.boss, p = s.p, home = B.home - b.w / 2;
    b.t += DT;
    switch (b.state) {
      case 'intro':
        if (b.t >= 1.4) { b.state = 'spawn'; b.t = 0; b.spawnLeft = B.minions[b.phase - 1]; }
        break;
      case 'spawn':
        if (b.spawnLeft > 0 && b.t >= 0.9) {
          s.en.push({ type: 'jelly', x: b.x - 20, y: GY - 36, w: 44, h: 36, vx: -78, x0: 0, x1: 0, patrol: false, seal: -1, minion: true, alive: true });
          b.spawnLeft--; b.t = 0;
          emit(s, 'minion', { x: b.x, y: b.y });
        } else if (b.spawnLeft === 0 && b.t >= 0.9) { b.state = 'walk'; b.t = 0; }
        break;
      case 'walk':
        b.x -= B.speeds[b.phase - 1] * DT;
        if (b.x + b.w < B.stopX - p.w - 240) { b.state = 'return'; b.t = 0; }
        break;
      case 'return':
        b.x += 190 * DT;
        if (b.x >= home) { b.x = home; b.state = 'spawn'; b.t = 0; b.spawnLeft = 0; }
        break;
      case 'hit':
        b.x = Math.min(home + 40, b.x + 330 * DT);
        if (b.t >= 0.6) { b.state = 'angry'; b.t = 0; emit(s, 'bossAngry', { x: b.x + b.w / 2, y: b.y }); }
        break;
      case 'angry':
        if (b.t >= 1.0) { b.phase++; b.state = 'spawn'; b.t = 0; b.spawnLeft = B.minions[b.phase - 1]; }
        break;
      case 'down':
        if (b.t >= 0.9) { b.state = 'gone'; s.finished = true; emit(s, 'finish'); }
        break;
      default: break;
    }
    // 跳回原位（return）时从主角头顶越过，不造成伤害
    if (b.state === 'walk' && hit(p, b)) {
      if (p.vy > 0 && prevBottom <= b.y + tol + 4) {
        b.hp--;
        const r = stompBounce(s, b, 500, 20);
        b.state = b.hp > 0 ? 'hit' : 'down';
        b.t = 0;
        emit(s, 'bossHit', { x: b.x + b.w / 2, y: b.y, hp: b.hp, combo: s.combo, perfect: r.perfect });
      } else if (p.inv <= 0) {
        hurtPlayer(s, 'boss');
      }
    }
  }
  const emit = (s, k, a) => { if (s.ev) s.ev.push({ k, ...a }); };
  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y + 0.01;
  const bridgeOpen = (s) => s.cat.phase === 'back' || s.cat.phase === 'done';

  function step(L, s, tap) {
    const p = s.p;
    s.n++;
    s.t += DT;
    if (tap && !s.finished) p.buf = CFG.buffer;

    let speed = s.finished ? 0 : CFG.runSpeed;
    // 减速区：解谜前留出观察时间
    const pcx = p.x + p.w / 2;
    for (const [a, b, f] of L.slow) if (pcx >= a && pcx <= b) speed *= f;
    // 首领战：进入擂台后站定迎击，并补满体力
    if (s.boss) {
      if (s.boss.state === 'idle' && p.x + p.w >= L.boss.stopX) {
        s.boss.state = 'intro'; s.boss.t = 0; p.hp = CFG.hp;
        emit(s, 'bossIntro');
      }
      if (s.boss.state !== 'idle') speed = 0;
    }
    // 猫咪机关：到达停驻点后原地等待，猫咪钻洞按开关、桥梁展开
    if (L.cat) {
      const c = s.cat;
      if (c.phase === 'idle' && p.x + p.w >= L.cat.stopX) { c.phase = 'go'; c.t = 0; emit(s, 'cat_go'); }
      if (c.phase !== 'idle' && c.phase !== 'done') {
        c.t += DT;
        const dur = CAT_DUR[c.phase];
        if (c.t >= dur) { c.t -= dur; c.phase = CAT_NEXT[c.phase]; emit(s, 'cat_' + c.phase); }
      }
      if (c.phase !== 'idle' && c.phase !== 'back' && c.phase !== 'done') speed = 0;
    }

    // 跳跃：踩怪后极短窗口内点按 = 完美弹跳；地面/土狼时间 = 一段跳；空中 = 二段跳
    if (p.buf > 0) {
      if (p.stompT > 0) {
        p.vy = -CFG.bounceV * CFG.perfectMul; p.stompT = 0; p.buf = 0;
        s.perfects++; s.score += 50;
        emit(s, 'perfect', { x: p.x + p.w / 2, y: p.y + p.h });
      } else if (p.onGround || p.coyote > 0) {
        p.vy = -CFG.jumpV; p.onGround = false; p.coyote = 0; p.air = 1; p.buf = 0;
        emit(s, 'jump', { n: 1 });
      } else if (p.air > 0) {
        p.vy = -CFG.doubleJumpV; p.air--; p.buf = 0;
        emit(s, 'jump', { n: 2, x: p.x + p.w / 2, y: p.y + p.h });
      }
    }
    p.buf = Math.max(0, p.buf - DT);
    p.stompT = Math.max(0, p.stompT - DT);
    p.inv = Math.max(0, p.inv - DT);

    p.vy = Math.min(p.vy + CFG.gravity * DT, CFG.maxFall);

    // 未解除的封印与地块一样是实心墙
    let walls = L.solids;
    if (L.seals.length) {
      const closed = L.seals.filter((_, i) => !s.seals[i]);
      if (closed.length) walls = L.solids.concat(closed);
    }

    // 水平：撞墙则贴住（自动奔跑被台阶挡住，需要跳上去）
    const prevCx = p.x + p.w / 2;
    p.x += speed * DT;
    p.blocked = false;
    for (const b of walls) if (hit(p, b)) { p.x = b.x - p.w; p.blocked = true; }

    // 垂直
    const prevBottom = p.y + p.h;
    const wasGround = p.onGround;
    p.y += p.vy * DT;
    p.onGround = false;
    for (const b of walls) {
      if (!hit(p, b)) continue;
      if (prevBottom <= b.y + 0.5) { p.y = b.y - p.h; p.vy = 0; p.onGround = true; }
      else if (p.vy < 0) { p.y = b.y + b.h; p.vy = 0; }
    }
    if (p.vy >= 0) {
      const plats = L.cat && bridgeOpen(s) ? L.plats.concat(L.cat.bridge) : L.plats;
      for (const pl of plats) {
        if (p.x + p.w > pl.x && p.x < pl.x + pl.w && prevBottom <= pl.y + 0.5 && p.y + p.h >= pl.y) {
          p.y = pl.y - p.h; p.vy = 0; p.onGround = true;
        }
      }
    }
    for (let i = 0; i < L.springs.length; i++) {
      s.springT[i] += DT;
      const sp = L.springs[i];
      if (p.vy >= 0 && hit(p, sp)) {
        p.y = sp.y - p.h; p.vy = -CFG.springV; p.onGround = false; p.air = 1; s.springT[i] = 0;
        emit(s, 'spring', { i });
      }
    }
    if (p.onGround) p.air = 1;
    if (!wasGround && p.onGround) emit(s, 'land');
    if (wasGround && !p.onGround && p.vy >= 0) p.coyote = CFG.coyote;
    else p.coyote = Math.max(0, p.coyote - DT);

    if (!s.finished) {
      // 真假门：主角中心越过门线时，脚在糖果台高度 = 走上门，否则 = 走下门
      for (let i = 0; i < L.doors.length; i++) {
        const d = L.doors[i];
        if (s.doorDone[i] || prevCx >= d.x || p.x + p.w / 2 < d.x) continue;
        const choice = p.y + p.h <= DOOR_LEDGE + 30 ? 'up' : 'down';
        if (choice === d.correct) {
          s.doorDone[i] = 1;
          s.score += 200; s.energy += 20;
          emit(s, 'doorOk', { i, choice });
        } else {
          s.doorFails++; s.doorFailsBy[i]++;
          p.x = d.respawnX; p.y = GY - p.h; p.vy = 0; p.onGround = true; p.air = 1; p.buf = 0; p.stompT = 0; p.coyote = 0;
          if (s.combo > 1) emit(s, 'comboEnd', { combo: s.combo });
          s.combo = 0; s.comboT = 0;
          emit(s, 'doorWrong', { i, choice, n: s.doorFailsBy[i] });
        }
      }

      // 怪物：下落中且脚底来自上方 = 踩踏；否则侧面受击
      const tol = s.easy ? CFG.stompTolEasy : CFG.stompTol;
      for (const e of s.en) {
        if (!e.alive) continue;
        if (e.vx) {
          e.x += e.vx * DT;
          if (e.patrol) {
            if (e.x < e.x0) { e.x = e.x0; e.vx = -e.vx; } else if (e.x > e.x1) { e.x = e.x1; e.vx = -e.vx; }
          } else if (e.minion && e.x + e.w < L.boss.stopX - 480) { e.alive = false; continue; }
        }
        if (!hit(p, e)) continue;
        if (p.vy > 0 && prevBottom <= e.y + tol) {
          e.alive = false;
          const r = stompBounce(s, e, 100, 10);
          emit(s, 'stomp', { x: e.x + e.w / 2, y: e.y, type: e.type, combo: s.combo, perfect: r.perfect, bonus: r.bonus, first: s.stomps === 1 });
          if (e.seal >= 0 && !s.seals[e.seal]) { s.seals[e.seal] = 1; emit(s, 'sealOpen', { i: e.seal }); }

          hurtPlayer(s, 'enemy');
          if (s.dead) return;
        }
      }
      if (s.boss && s.boss.state !== 'idle') {
        bossStep(L, s, prevBottom, tol);
        if (s.dead) return;
      }
      // 连击窗口
      if (s.comboT > 0) {
        s.comboT -= DT;
        if (s.comboT <= 0) {
          s.comboT = 0;
          if (s.combo > 1) emit(s, 'comboEnd', { combo: s.combo });
          s.combo = 0;
        }
      }
      // 星星
      const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
      for (let i = 0; i < L.stars.length; i++) {
        if (s.got[i]) continue;
        const st = L.stars[i];
        if (Math.abs(st.x - cx) < 26 && Math.abs(st.y - cy) < 36) {
          s.got[i] = 1; s.stars++; s.score += 20; s.energy += 2;
          emit(s, 'star', { x: st.x, y: st.y });
        }
      }
      if (p.y > VH + 40) { s.dead = true; s.cause = 'pit'; return; }
      if (L.finish && !s.finished && p.x + p.w / 2 >= L.finish) { s.finished = true; emit(s, 'finish'); }
    }
  }

  // ===== 素材 =====
  const IMG = {};
  const SPRITES = ['run1', 'run2', 'run3', 'run4', 'run5', 'run6', 'jump', 'fall', 'hurt', 'win', 'jelly', 'pudding', 'king', 'cat_idle', 'cat_cheer', 'cat_worry'];
  function loadImg(name, src) {
    return new Promise((res) => {
      const im = new Image();
      im.onload = () => { IMG[name] = im; res(); };
      im.onerror = () => res();
      im.src = src;
    });
  }
  const assetsReady = Promise.all([
    ...SPRITES.map((n) => loadImg(n, `assets/sprites/${n}.png`)),
    loadImg('bg', 'assets/bg_far.jpg'),
  ]);

  // ===== 存档 =====
  const SAVE_KEY = 'mmq-demo-v1';
  let save = { unlocked: 1, best: {}, muted: false };
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) save = { ...save, ...JSON.parse(raw) };
  } catch (e) { /* 隐私模式等情况下忽略 */ }
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* 忽略 */ } }

  // ===== 声音（WebAudio 合成，无外部文件） =====
  const midi = (m) => 440 * 2 ** ((m - 69) / 12);
  const MEL = [76, 79, 81, 79, 76, 74, 72, 74, 76, 79, 84, 81, 79, -1, 79, -1, 77, 76, 74, 72, 74, 76, 77, 79, 81, 79, 77, 76, 74, -1, 72, -1];
  const BAS = [48, -1, 55, -1, 45, -1, 52, -1, 41, -1, 48, -1, 43, -1, 50, -1, 41, -1, 48, -1, 43, -1, 50, -1, 45, -1, 52, -1, 43, -1, 47, -1];
  const Snd = {
    ctx: null, out: null, music: null, timer: 0, stepI: 0, next: 0, playing: false,
    init() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.out = this.ctx.createGain();
        this.out.gain.value = save.muted ? 0 : 0.9;
        this.out.connect(this.ctx.destination);
        this.music = this.ctx.createGain();
        this.music.gain.value = 0.8;
        this.music.connect(this.out);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    },
    setMuted(m) { save.muted = m; persist(); if (this.out) this.out.gain.value = m ? 0 : 0.9; },
    tone(f, d, o = {}) {
      if (!this.ctx || save.muted) return;
      const c = this.ctx, t = c.currentTime + Math.max(0, o.at || 0);
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
      const v = o.vol ?? 0.15;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      osc.connect(g);
      g.connect(o.bus || this.out);
      osc.start(t);
      osc.stop(t + d + 0.03);
    },
    sfx(name, a = 0) {
      switch (name) {
        case 'jump': this.tone(420, 0.13, { to: 820, type: 'square', vol: 0.05 }); break;
        case 'jump2': this.tone(640, 0.15, { to: 1280, type: 'triangle', vol: 0.12 }); this.tone(1500, 0.08, { at: 0.06, vol: 0.05 }); break;
        case 'stomp': {
          const sc = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
          const f = 523.25 * 2 ** (sc[Math.min(a - 1, sc.length - 1)] / 12);
          this.tone(f, 0.16, { type: 'square', vol: 0.06 });
          this.tone(f * 2, 0.12, { at: 0.04, vol: 0.06 });
          this.tone(190, 0.08, { to: 60, vol: 0.2 });

  // 饼干地块：预渲染到离屏画布
  function drawCookie(g, x, y, w, h, seed) {
    const grad = g.createLinearGradient(0, y, 0, y + 150);
    grad.addColorStop(0, '#e3a564');

    g.fillStyle = grad;

    g.lineWidth = 3; g.strokeStyle = '#6e3c1d'; g.stroke();
    g.fillStyle = 'rgba(110, 60, 29, 0.32)';
    for (let i = 0; i * 30 + 16 < w - 6; i++) {

        const hx = x + 16 + i * 30 + (j % 2) * 15, hy = y + 40 + j * 30;
        if (hx < x + w - 8) { g.beginPath(); g.arc(hx, hy, 2.6, 0, Math.PI * 2); g.fill(); }

      g.save(); g.translate(sx, sy); g.rotate(hash(seed + i * 9) * Math.PI);

  function solidCanvas(b) {

  // 远景与中景
  function drawBackground(camX) {

    const bg = IMG.bg;
    if (bg) {
      const h = VH + 50, w = (bg.width * h) / bg.height;

      for (let i = 0, x = -off; x < W; i++, x += w) {

          ctx.save(); ctx.translate(x + w, -30); ctx.scale(-1, 1); ctx.drawImage(bg, 0, 0, w, h); ctx.restore();
        } else ctx.drawImage(bg, x, -30, w, h);

    const hill = (wx) => 352 + Math.sin(wx * 0.006) * 22 + Math.sin(wx * 0.017 + 1) * 9;
    const spacing = 210, first = Math.floor(off / spacing) - 1;

    ctx.beginPath(); ctx.moveTo(0, VH);
    for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, hill(x + off));

  }

  // ===== 特效 =====

        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: o.g ?? 500,
        life: (o.life ?? 0.6) * (0.6 + Math.random() * 0.6), max: o.life ?? 0.6,
        size: (o.size ?? 6) * (0.6 + Math.random() * 0.7), kind: o.kind || 'star',

          const d = G.L.doors[e.i];
          Snd.sfx('door');
          burst(G.fxW, d.x, e.choice === 'up' ? DOOR_LEDGE - 40 : GY - 40, 18, { kind: 'star', speed: 240, size: 7, colors: STAR_COLORS, life: 0.8 });
          popup(d.x, e.choice === 'up' ? DOOR_LEDGE - 100 : GY - 110, '选对啦！', { size: 26, stroke: '#2f9c7d' });
          G.cat.mood = 'cheer'; G.cat.moodT = 1.4;
          break;
        }
        case 'doorWrong': {
          const d = G.L.doors[e.i];
          Snd.sfx('wrong');
          G.flash = 0.45;
          G.cat.mood = 'worry'; G.cat.moodT = 2;
          G.cat.x = s.p.x - 38; G.cat.y = s.p.y - 16;
          G.cat.bubble = e.n >= 2 ? `走${d.correct === 'up' ? '上面' : '下面'}那扇门！` : '不是这扇门喵…再看看路牌！';
          G.cat.bubbleT = 2.4;
          break;
        }
        case 'sealOpen': {
          const sl = G.L.seals[e.i];
          Snd.sfx('seal');
          for (let y = sl.y + 20; y < GY; y += 40) burst(G.fxW, sl.x + 14, y, 5, { kind: 'star', speed: 200, size: 6, colors: ['#c7b3ff', '#fff', '#ffd54a'], life: 0.8 });
          popup(sl.x, sl.y + 40, '封印解除！', { size: 26, stroke: '#7a4fd0' });
          break;
        }
        case 'bossIntro':
          Snd.sfx('boss');
          G.cat.bubble = '小心！是捣蛋布丁王！'; G.cat.bubbleT = 1.6;
          popup(s.p.x + s.p.w / 2, s.p.y - 30, '体力补满', { size: 18, stroke: '#2f9c7d' });
          break;
        case 'minion': Snd.sfx('minion'); break;
        case 'bossHit':
          Snd.sfx('bossHit');
          G.shake = 0.35;
          burst(G.fxW, e.x, e.y + 10, 26, { kind: 'star', speed: 320, size: 9, colors: STAR_COLORS, life: 0.9 });
          popup(e.x, e.y - 40, e.hp > 0 ? `命中！还剩 ${e.hp} 下` : '打倒布丁王！', { size: 26, stroke: '#7a4fd0' });
          if (e.combo >= 2) popup(e.x, e.y - 72, `${e.combo} 连击！`, { size: 20 });
          G.cat.mood = 'cheer'; G.cat.moodT = 1.2;
          G.comboPop = 1;
          break;
        case 'bossAngry': popup(e.x, e.y - 30, '生气了！', { size: 22, stroke: '#b8325f' }); Snd.sfx('minion'); break;
        case 'finish': break;
        default: break;
      }
    }
    s.ev.length = 0;
  }

  // ===== 世界绘制 =====
  function playerSprite(s) {
    const p = s.p;
    if (G.mode === 'dying') return 'hurt';
    if (s.finished) return p.onGround ? 'win' : 'fall';
    if (p.inv > CFG.invuln - 0.35) return 'hurt';
    if (!p.onGround) return p.vy < -60 ? 'jump' : 'fall';
    // 原地等待（猫咪机关、首领战、被墙挡住）用站姿，奔跑时播 6 帧循环（约 2.2 圈/秒）
    if (G.idleT > 0.08) return 'fall';
    return 'run' + (1 + (Math.floor(G.runAnim * 13) % 6));
  }
  function catPose(s) {
    // 机关演出期间猫咪的位置由阶段决定，其余时间跟随主角
    const C = G.L.cat, c = s && s.cat;
    if (!C || !c || c.phase === 'idle' || c.phase === 'done' || c.phase === 'none') return null;
    const ease = (t) => t * t * (3 - 2 * t);
    if (c.phase === 'go') {
      const t = ease(Math.min(1, c.t / CAT_DUR.go));
      return { x: G.cat.fromX + (C.ventX - G.cat.fromX) * t, y: G.cat.fromY + (GY - G.cat.fromY) * t - Math.sin(t * Math.PI) * 50, sc: 1 - Math.max(0, t - 0.7) * 2.6, key: 'cat_idle' };
    }
    if (c.phase === 'tunnel') return { hidden: true };
    if (c.phase === 'press') return { x: C.btnX, y: GY - 34 + Math.max(0, 0.15 - c.t) * 120, sc: Math.min(1, c.t * 6), key: 'cat_cheer' };
    if (c.phase === 'bridge') return { x: C.btnX, y: GY - 34 - Math.abs(Math.sin(c.t * 9)) * 10, sc: 1, key: 'cat_cheer' };
    if (c.phase === 'back') {
      const t = ease(Math.min(1, c.t / CAT_DUR.back)), p = s.p;
      const tx = p.x - 34, ty = p.y - 20;
      return { x: C.btnX + (tx - C.btnX) * t, y: GY - 34 + (ty - GY + 34) * t - Math.sin(t * Math.PI) * 60, sc: 1, key: 'cat_cheer' };
    }
    return null;
  }

  // 门、路牌、减速区、封印、首领
  function drawIcon(kind, x, y, r) {
    if (kind === 'heart') {
      heartPath(ctx, x, y + r * 0.2, r * 0.95);
      ctx.fillStyle = '#ff5d8f'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#b8325f'; ctx.stroke();
    } else if (kind === 'star') {
      drawStar(ctx, x, y, r);
    } else {
      // 月牙：外圆大弧 + 内圆反向弧
      ctx.beginPath();
      ctx.arc(x, y, r, -0.915, 0.915, true);
      ctx.arc(x + 0.5 * r, y, 0.8 * r, 1.433, -1.433, false);
      ctx.closePath();
      ctx.fillStyle = '#ffd54a'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#d98a00'; ctx.stroke();
    }
  }
  function drawDoorTower(d, s, i) {
    const cx = d.x, w = 64, top = 236, x = cx - w / 2;
    const done = s && s.doorDone[i], fails = s ? s.doorFailsBy[i] : 0;
    ctx.lineWidth = 3; ctx.strokeStyle = '#a84a70';
    ctx.fillStyle = '#ffe3ee';
    rr(ctx, x - 6, top, w + 12, GY - top + 4, [14, 14, 0, 0]); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 16, top + 6); ctx.lineTo(cx, top - 44); ctx.lineTo(x + w + 16, top + 6); ctx.closePath();
    ctx.fillStyle = '#ff9ec0'; ctx.fill(); ctx.stroke();
    drawStar(ctx, cx, top - 50, 10);
    for (const [which, y0, y1] of [['up', DOOR_LEDGE - 78, DOOR_LEDGE - 2], ['down', GY - 76, GY]]) {
      const isCorrect = which === d.correct;
      const glow = !done && fails >= 2 && isCorrect;
      if (glow) {
        ctx.fillStyle = `rgba(255, 228, 110, ${0.5 + Math.sin(G.time * 6) * 0.2})`;
        rr(ctx, x - 2, y0 - 6, w + 4, y1 - y0 + 8, 18); ctx.fill();
        const ax = x - 34 + Math.sin(G.time * 6) * 6, ay = (y0 + y1) / 2;
        ctx.fillStyle = '#ff6f9c';
        ctx.beginPath(); ctx.moveTo(ax, ay - 12); ctx.lineTo(ax + 18, ay); ctx.lineTo(ax, ay + 12); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = done && isCorrect ? '#fff4c2' : '#7b4a8c';
      rr(ctx, x + 8, y0, w - 16, y1 - y0, [22, 22, 3, 3]); ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#4b2350'; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, y0 + 25, 15, 0, Math.PI * 2); ctx.fill();
      drawIcon(which === 'up' ? d.up : d.down, cx, y0 + 25, 11);
    }
  }
  function drawSign(d) {
    const x = d.signX, icon = d.correct === 'up' ? d.up : d.down;
    // 牌面立得比猫咪飞行高度更高，避免被挡住
    ctx.fillStyle = '#c98a4b'; ctx.fillRect(x - 3, GY - 150, 6, 150);
    ctx.fillStyle = '#fff6ec'; rr(ctx, x - 40, GY - 222, 80, 72, 12); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#a84a70'; ctx.stroke();
    text(ctx, '正确的门', x, GY - 206, 14, { fill: '#8a5772', sw: 0 });
    drawIcon(icon, x, GY - 176, 17);
  }
  function drawSlowZone([a, b]) {
    ctx.fillStyle = 'rgba(111, 211, 181, 0.4)';
    rr(ctx, a, GY - 5, b - a, 10, 5); ctx.fill();
    ctx.fillStyle = '#c98a4b'; ctx.fillRect(a - 2, GY - 44, 4, 44);
    ctx.fillStyle = '#e1f7f0'; rr(ctx, a - 26, GY - 68, 52, 26, 8); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#2f9c7d'; ctx.stroke();
    text(ctx, '慢行', a, GY - 54, 14, { fill: '#2f9c7d', sw: 0 });
  }
  function drawSeal(sl) {
    const h = GY - sl.y, cx = sl.x + sl.w / 2, cy = sl.y + h / 2;
    const g = ctx.createLinearGradient(sl.x, 0, sl.x + sl.w, 0);
    g.addColorStop(0, 'rgba(169, 139, 232, 0.2)'); g.addColorStop(0.5, 'rgba(199, 179, 255, 0.85)'); g.addColorStop(1, 'rgba(169, 139, 232, 0.2)');
    ctx.fillStyle = g; rr(ctx, sl.x, sl.y, sl.w, h, 12); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#7a4fd0'; ctx.stroke();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    for (let k = 0; k < 6; k++) {
      const y = sl.y + ((k * 52 + G.time * 40) % h);
      starPath(ctx, cx + Math.sin(k * 2 + G.time * 2) * 6, y, 4, G.time); ctx.fill();
    }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#7a4fd0'; ctx.lineWidth = 3; ctx.stroke();
    drawStar(ctx, cx, cy, 11);
  }
  function drawBoss(s) {
    const b = s.boss;
    if (!b || b.state === 'idle' || b.state === 'gone') return;
    let x = b.x + b.w / 2, y = b.y + b.h + 4, sx = 1, sy = 1, alpha = 1, flip = false;
    const t = b.t;
    if (b.state === 'intro') {
      const k = Math.min(1, t / 0.55);
      y -= (1 - k * k) * 460;
      if (t > 0.55 && t < 0.85) { const q = Math.sin(((t - 0.55) / 0.3) * Math.PI); sx = 1 + q * 0.25; sy = 1 - q * 0.25; }
    } else if (b.state === 'walk' || b.state === 'spawn') {
      sy = 1 + Math.sin(G.time * 12) * 0.04; sx = 2 - sy;
    } else if (b.state === 'return') {
      flip = true; y -= Math.abs(Math.sin(t * 4.5)) * 150;
    } else if (b.state === 'hit') {
      const q = Math.max(0, 1 - t / 0.3); sx = 1 + q * 0.35; sy = 1 - q * 0.35;
    } else if (b.state === 'angry') {
      x += Math.sin(G.time * 70) * 3;
    } else if (b.state === 'down') {
      sy = Math.max(0.2, 1 - t); sx = 1 + t * 0.4; alpha = Math.max(0, 1 - t * 0.9);
    }
    ctx.fillStyle = 'rgba(90, 40, 30, 0.22)';
    ctx.beginPath(); ctx.ellipse(b.x + b.w / 2, GY, 46, 7, 0, 0, Math.PI * 2); ctx.fill();
    sprite('king', x, y, 0.34, { flip, sx, sy, alpha });
    if (b.state === 'angry') text(ctx, '!!', x + 36, b.y - 18 + Math.sin(G.time * 20) * 3, 30, { fill: '#ff5d5d', stroke: '#fff', sw: 6 });
  }
  // 站定时（首领战、被墙挡住）猫咪提示起跳时机：怪物进入"跳起后正好落在它头上"的距离区间
  function jumpCue(s) {
    const p = s.p, L = G.L;
    const fight = s.boss && s.boss.state !== 'idle' && s.boss.state !== 'gone';
    if (!(fight || p.blocked) || !p.onGround) return null;
    let best = null;
    const consider = (o, v) => {
      const gap = o.x > p.x ? o.x - (p.x + p.w) : p.x - (o.x + o.w);
      if (gap < 0) return;
      const disc = Math.sqrt(Math.max(0, CFG.jumpV ** 2 - 2 * CFG.gravity * o.h));
      const t1 = (CFG.jumpV - disc) / CFG.gravity, t2 = (CFG.jumpV + disc) / CFG.gravity;
      if (gap >= v * (t1 + 0.03) && gap <= v * (t2 - 0.05) && (!best || gap < best.gap)) best = { x: o.x + o.w / 2, y: o.y, gap };
    };
    if (fight && s.boss.state === 'walk') consider(s.boss, L.boss.speeds[s.boss.phase - 1]);
    for (const e of s.en) {
      if (!e.alive || !e.vx) continue;
      if ((e.vx < 0 && e.x > p.x) || (e.vx > 0 && e.x < p.x)) consider(e, Math.abs(e.vx));
    }
    return best;
  }

  function drawWorld(L, s) {
    const x0 = G.camX - 80, x1 = G.camX + W + 80, t = G.time;
    if (L.finish > x0 - 100 && L.finish < x1 + 100) drawGoal(L.finish);
    for (const b of L.solids) {
      if (b.x + b.w < x0 || b.x > x1) continue;
      const c = solidCanvas(b);
      if (c.width && c.height) ctx.drawImage(c, b.x - c.pad, b.y - c.pad, c.lw, c.lh);
    }
    for (const z of L.slow) if (z[1] > x0 && z[0] < x1) drawSlowZone(z);
    L.doors.forEach((d, i) => {
      if (d.signX > x0 - 60 && d.signX < x1 + 60) drawSign(d);
      if (d.x > x0 - 60 && d.x < x1 + 60) drawDoorTower(d, s, i);
    });
    L.seals.forEach((sl, i) => { if ((!s || !s.seals[i]) && sl.x > x0 && sl.x < x1) drawSeal(sl); });
    if (L.cat) {
      const C = L.cat, c = s ? s.cat : { phase: 'idle', t: 0 };
      // 通风洞
      ctx.fillStyle = '#3b2230';
      ctx.beginPath(); ctx.ellipse(C.ventX, GY + 4, 15, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ff9ec0'; ctx.lineWidth = 3; ctx.stroke();
      // 猫爪路牌
      ctx.fillStyle = '#c98a4b'; ctx.fillRect(C.ventX - 44, GY - 34, 4, 34);
      ctx.fillStyle = '#fff6ec'; rr(ctx, C.ventX - 58, GY - 52, 32, 24, 6); ctx.fill();
      ctx.strokeStyle = '#a84a70'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#ff7fa8';
      ctx.beginPath(); ctx.arc(C.ventX - 42, GY - 37, 5, 0, Math.PI * 2); ctx.fill();
      for (const [dx, dy] of [[-7, -7], [-2, -10], [3, -10], [8, -7]]) { ctx.beginPath(); ctx.arc(C.ventX - 42 + dx * 0.8, GY - 37 + dy * 0.6, 2, 0, Math.PI * 2); ctx.fill(); }
      // 开关
      const pressed = c.phase === 'bridge' || c.phase === 'back' || c.phase === 'done' || (c.phase === 'press' && c.t > 0.15);
      ctx.fillStyle = '#c98a4b'; rr(ctx, C.btnX - 20, GY - 8, 40, 8, 3); ctx.fill();
      if (pressed) {
        ctx.fillStyle = 'rgba(255, 230, 120, 0.45)';
        ctx.beginPath(); ctx.arc(C.btnX, GY - 8, 26 + Math.sin(t * 6) * 3, Math.PI, 0); ctx.fill();
      }
      ctx.fillStyle = pressed ? '#6fd3b5' : '#ff6f9c';
      rr(ctx, C.btnX - 14, GY - (pressed ? 12 : 22), 28, pressed ? 6 : 16, [8, 8, 2, 2]); ctx.fill();
      ctx.strokeStyle = '#a84a70'; ctx.lineWidth = 2; ctx.stroke();
      // 桥
      const B = C.bridge;
      let bw = 0;
      if (c.phase === 'bridge') bw = B.w * Math.min(1, c.t / CAT_DUR.bridge);
      else if (c.phase === 'back' || c.phase === 'done') bw = B.w;
      if (bw > 0) {
        for (let x = 0; x < bw; x += 32) {
          const w = Math.min(30, bw - x);
          ctx.fillStyle = (x / 32) % 2 ? '#c9f0e4' : '#ffd1e3';
          rr(ctx, B.x + x + 1, B.y, w, 16, 5); ctx.fill();
          ctx.strokeStyle = '#a84a70'; ctx.lineWidth = 2; ctx.stroke();
        }
      }
    }
    for (const pl of L.plats) if (pl.x + pl.w > x0 && pl.x < x1) drawMacaron(pl.x, pl.y, pl.w);
    L.springs.forEach((sp, i) => { if (sp.x > x0 && sp.x < x1) drawSpring(sp, s ? s.springT[i] : 9); });
    L.stars.forEach((st, i) => {
      if ((s && s.got[i]) || st.x < x0 || st.x > x1) return;
      drawStar(ctx, st.x, st.y + Math.sin(t * 3 + i) * 3, 11, Math.sin(t * 2 + i) * 0.25);
    });
    const ens = s ? s.en : L.enemies;
    for (const e of ens) {
      if ((s && !e.alive) || e.x + e.w < x0 || e.x > x1) continue;
      const sq = 1 + Math.sin(t * 6 + e.x * 0.05) * 0.05;
      ctx.fillStyle = 'rgba(90, 40, 30, 0.18)';
      ctx.beginPath(); ctx.ellipse(e.x + e.w / 2, e.y + e.h, e.w * 0.55, 4, 0, 0, Math.PI * 2); ctx.fill();
      if (e.seal >= 0) {
        ctx.fillStyle = 'rgba(169, 139, 232, 0.35)';
        ctx.beginPath(); ctx.ellipse(e.x + e.w / 2, e.y + e.h / 2, 36, 28, 0, 0, Math.PI * 2); ctx.fill();
      }
      sprite(e.type, e.x + e.w / 2, e.y + e.h + 3, e.type === 'jelly' ? 0.29 : 0.27, { flip: e.vx > 0, sx: 2 - sq, sy: sq });
      if (e.seal >= 0) drawStar(ctx, e.x + e.w / 2, e.y - 30 + Math.sin(t * 5) * 4, 11, t);
    }
    if (!s) return;
    drawBoss(s);
    const p = s.p;
    // 站定迎击时的起跳提示
    const cue = G.mode === 'play' ? jumpCue(s) : null;
    if (cue) {
      text(ctx, '!', cue.x, cue.y - 40 - Math.abs(Math.sin(t * 10)) * 6, 34, { fill: '#ffd54a', stroke: '#b8325f', sw: 6 });
      G.cat.bubble = '现在跳！'; G.cat.bubbleT = 0.2;
    }
    // 猫咪
    const pose = catPose(s);
    if (!pose || !pose.hidden) {
      const cx = pose ? pose.x : G.cat.x, cy = pose ? pose.y : G.cat.y;
      if (!pose) { G.cat.x = cx; G.cat.y = cy; }
      const key = pose ? pose.key : G.cat.mood === 'cheer' ? 'cat_cheer' : G.cat.mood === 'worry' ? 'cat_worry' : 'cat_idle';
      const sc = 0.3 * (pose ? Math.max(0, pose.sc) : 1);
      ctx.fillStyle = 'rgba(255, 240, 160, 0.35)';
      ctx.beginPath(); ctx.arc(cx, cy - 22, 30, 0, Math.PI * 2); ctx.fill();
      sprite(key, cx, cy + 4, sc);
      if (G.cat.bubbleT > 0) {
        ctx.font = `16px ${FONT}`;
        const tw = ctx.measureText(G.cat.bubble).width + 20;
        ctx.globalAlpha = Math.min(1, G.cat.bubbleT * 3);
        ctx.fillStyle = '#fff'; rr(ctx, cx - tw / 2, cy - 92, tw, 28, 14); ctx.fill();
        ctx.strokeStyle = '#c7b3ff'; ctx.lineWidth = 2; ctx.stroke();
        text(ctx, G.cat.bubble, cx, cy - 78, 16, { fill: '#5b2a45', sw: 0 });
        ctx.globalAlpha = 1;
      }
    }
    // 主角
    const key = playerSprite(s);
    if (p.onGround && G.mode !== 'dying') {
      ctx.fillStyle = 'rgba(90, 40, 30, 0.22)';
      ctx.beginPath(); ctx.ellipse(p.x + p.w / 2, p.y + p.h, 17, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    }
    const flicker = p.inv > 0 && Math.floor(G.time * 18) % 2 ? 0.35 : 1;
    sprite(key, p.x + p.w / 2, p.y + p.h + 3 + G.dieY, 0.42, { sx: G.sqx, sy: G.sqy, alpha: flicker });
    drawFx(G.fxW);
    for (const q of G.pops) {
      const k = q.life / q.max;
      ctx.globalAlpha = Math.min(1, k * 2.2);
      text(ctx, q.str, q.x, q.y - (1 - k) * 34, q.size * (k > 0.85 ? 1 + (k - 0.85) * 3 : 1), { stroke: q.stroke, sw: 5 });
    }
    ctx.globalAlpha = 1;
  }

  // ===== HUD =====
  function drawHUD() {
    const s = G.s, L = G.L, p = s.p;
    const x0 = 14 + safeL, y0 = 12 + safeT;
    ctx.fillStyle = 'rgba(255, 248, 240, 0.93)';
    rr(ctx, x0, y0, 206, 48, 24); ctx.fill();
    ctx.strokeStyle = '#ffc2d6'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#ff7fa8'; ctx.beginPath(); ctx.arc(x0 + 25, y0 + 24, 19, 0, Math.PI * 2); ctx.fill();
    text(ctx, L.code, x0 + 25, y0 + 25, 15, { sw: 0 });
    for (let i = 0; i < CFG.hp; i++) {
      heartPath(ctx, x0 + 62 + i * 28, y0 + 26, 12);
      ctx.fillStyle = i < p.hp ? '#ff5d8f' : '#f1dde5'; ctx.fill();
      ctx.strokeStyle = i < p.hp ? '#b8325f' : '#d8bcc8'; ctx.lineWidth = 2; ctx.stroke();
    }
    drawStar(ctx, x0 + 132, y0 + 24, 11);
    text(ctx, `${s.stars}`, x0 + 150, y0 + 25, 20, { align: 'left', fill: '#5b2a45', sw: 0 });
    const starGoal = (L.goals.find((g) => g[0] === 'stars') || [])[1];
    if (starGoal) text(ctx, `/${starGoal}`, x0 + 150 + ctx.measureText(`${s.stars}`).width + 2, y0 + 28, 13, { align: 'left', fill: '#a07f8f', sw: 0 });

    // 首领血量
    const b = s.boss;
    if (b && b.state !== 'idle' && b.state !== 'gone') {
      const bw = 250, bx = W / 2 - bw / 2, by = VH - 48;
      ctx.fillStyle = 'rgba(255, 248, 240, 0.94)'; rr(ctx, bx, by, bw, 36, 18); ctx.fill();
      ctx.strokeStyle = '#ffc2d6'; ctx.lineWidth = 3; ctx.stroke();
      text(ctx, '捣蛋布丁王', bx + 18, by + 19, 17, { align: 'left', fill: '#5b2a45', sw: 0 });
      for (let k = 0; k < 3; k++) {
        const cx = bx + 152 + k * 32, on = k < b.hp;
        ctx.fillStyle = on ? '#ffc23a' : '#eadbe2';
        rr(ctx, cx - 11, by + 9, 22, 18, [10, 10, 4, 4]); ctx.fill();
        ctx.strokeStyle = on ? '#b06d36' : '#d8bcc8'; ctx.lineWidth = 2; ctx.stroke();
        if (on) { ctx.fillStyle = '#9a5a26'; rr(ctx, cx - 11, by + 9, 22, 6, [10, 10, 0, 0]); ctx.fill(); }
      }
    }

    // 连击
    if (s.combo >= 2) {
      const pop = 1 + G.comboPop * 0.35;
      ctx.save();
      ctx.translate(W / 2, y0 + 30);
      ctx.scale(pop, pop);
      text(ctx, `×${s.combo}`, -14, 0, 44, { fill: '#ff6f9c', stroke: '#fff', sw: 8 });
      text(ctx, '连击', 50, 6, 20, { fill: '#7a4fd0', stroke: '#fff', sw: 5 });
      ctx.restore();
      const bw = 120 * (s.comboT / CFG.comboWindow);
      ctx.fillStyle = 'rgba(255,255,255,0.8)'; rr(ctx, W / 2 - 60, y0 + 60, 120, 6, 3); ctx.fill();
      ctx.fillStyle = '#ff7fa8'; rr(ctx, W / 2 - 60, y0 + 60, Math.max(6, bw), 6, 3); ctx.fill();
    }
    if (s.maxCombo >= 2) text(ctx, `最高 ×${s.maxCombo}`, W / 2, y0 + (s.combo >= 2 ? 80 : 14), 14, { fill: '#8a5772', stroke: '#fff', sw: 4 });

    // 魔法能量（40 / 80 为清场等级分界）
    const reserve = 70 / scale + 8;
    const bw = Math.min(230, W * 0.22), bx = W - safeR - reserve - bw, by = y0 + 12;
    ctx.fillStyle = 'rgba(255, 248, 240, 0.93)'; rr(ctx, bx - 30, y0, bw + 40, 48, 24); ctx.fill();
    ctx.strokeStyle = '#d9c8ff'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#efe6ff'; rr(ctx, bx, by + 4, bw, 16, 8); ctx.fill();
    const e = Math.min(100, s.energy) / 100;
    if (e > 0) {
      const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      g.addColorStop(0, '#ff9ec0'); g.addColorStop(1, '#9b7cf0');
      ctx.fillStyle = g; rr(ctx, bx, by + 4, Math.max(16, bw * e), 16, 8); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2;
    for (const m of [0.4, 0.8]) { ctx.beginPath(); ctx.moveTo(bx + bw * m, by + 4); ctx.lineTo(bx + bw * m, by + 20); ctx.stroke(); }
    ctx.fillStyle = '#9b7cf0'; ctx.beginPath(); ctx.arc(bx - 8, by + 12, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(bx - 8, by + 15, 5, 0, Math.PI * 2); ctx.fill();
    for (const [dx, dy] of [[-6, -4], [-2, -8], [2, -8], [6, -4]]) { ctx.beginPath(); ctx.arc(bx - 8 + dx, by + 12 + dy, 2.2, 0, Math.PI * 2); ctx.fill(); }
    text(ctx, `${Math.floor(Math.min(100, s.energy))}`, bx + bw / 2, by + 12, 13, { fill: '#5b2a45', stroke: '#fff', sw: 3 });

    // 关卡开场与提示
    if (s.t < 2) {
      const a = Math.min(1, (2 - s.t) * 2);
      ctx.globalAlpha = a;
      text(ctx, `${L.code} ${L.name}`, W / 2, 200, 40, { fill: '#fff', stroke: '#d94f7e', sw: 8 });
      ctx.globalAlpha = 1;
    }
    let hint = null;
    const fight = s.boss && s.boss.state !== 'idle';
    if (fight) hint = s.boss.phase === 1 && s.boss.state !== 'gone' ? '站稳！等布丁王走近，听猫咪喊“现在跳！”' : null;
    else for (const [a, b, str] of L.hints) if (p.x >= a && p.x <= b) hint = str;
    if (G.mode === 'play' && G.s.easy && p.x < 1200 && !hint) hint = '落下时踩在怪物头上会弹起来';
    if (hint) {
      ctx.font = `20px ${FONT}`;
      const tw = ctx.measureText(hint).width + 36;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; rr(ctx, W / 2 - tw / 2, y0 + 96, tw, 38, 19); ctx.fill();
      ctx.strokeStyle = '#ffc2d6'; ctx.lineWidth = 3; ctx.stroke();
      text(ctx, hint, W / 2, y0 + 116, 20, { fill: '#5b2a45', sw: 0 });
    }
  }

  // ===== 关底清场演出 =====
  const TIER_NAME = ['', '基础清场 · 星光波', '华丽清场 · 猫咪魔法阵', '传奇清场 · 爱心星雨'];
  function startClear() {
    const s = G.s, e = s.energy;
    const tier = e >= 80 ? 3 : e >= 40 ? 2 : 1;
    const bonus = [0, 0, 500, 1000][tier];
    s.score += bonus;
    const mobs = [], n = 7, left = W * 0.5, span = W * 0.42 - safeR;
    for (let i = 0; i < n; i++) {
      mobs.push({
        type: i === 3 ? 'king' : i % 2 ? 'pudding' : 'jelly',
        x: left + (span * i) / (n - 1) + (hash(i) - 0.5) * 18,
        y: GY - (i === 3 ? 0 : (i % 3) * 6),
        appear: 0.1 + i * 0.05, at: 0, done: false,
      });
    }
    G.clear = { t: 0, tier, bonus, mobs, dur: 3.4, magic: false, popped: 0 };
    G.mode = 'clear';
    G.cat.mood = 'cheer'; G.cat.moodT = 9;
    btnPause.hidden = true;
  }
  function updateClear(dt) {
    const c = G.clear, s = G.s;
    c.t += dt;
    const gx = s.p.x + s.p.w / 2 - G.camX, gy = s.p.y + s.p.h - 50;
    if (!c.magic && c.t > 0.6) { c.magic = true; Snd.sfx('magic', c.tier); }
    c.mobs.forEach((m, i) => {
      let at;
      if (c.tier === 1) at = 0.75 + (m.x - gx) / 650;
      else if (c.tier === 2) at = 1.25 + i * 0.13;
      else at = 1.0 + ((i * 3) % 7) * 0.1;
      if (!m.done && c.t >= at) {
        m.done = true;
        Snd.sfx('pop', c.popped++ * 2);
        burst(G.fxS, m.x, m.y - 30, m.type === 'king' ? 30 : 16, { kind: 'star', speed: 280, size: 8, colors: STAR_COLORS, life: 0.9, g: 260 });
        burst(G.fxS, m.x, m.y - 30, 10, { kind: 'heart', speed: 160, size: 7, colors: ['#ff9ec0', '#fff'], life: 0.8, g: -60 });
      }
    });
    if (c.tier === 3 && c.t > 0.6 && c.t < 2.8) {
      for (let k = 0; k < 3; k++) {
        G.fxS.push({ x: Math.random() * W, y: -20, vx: (Math.random() - 0.5) * 40, vy: 160 + Math.random() * 160, g: 60, life: 2.6, max: 2.6,
          size: 6 + Math.random() * 8, kind: Math.random() < 0.5 ? 'heart' : 'star', color: STAR_COLORS[k % 4], rot: Math.random() * 6, vr: (Math.random() - 0.5) * 4 });
      }
    }
    if (c.tier >= 2 && c.t > 0.5 && c.t < 0.75) burst(G.fxS, gx + 24, gy - 40, 2, { kind: 'star', speed: 80, size: 5, colors: ['#fff', '#ffd54a'], life: 0.4, g: 0 });
    if (c.t >= c.dur) finishLevel();
  }
  function drawClear() {
    const c = G.clear, s = G.s, t = c.t;
    const gx = s.p.x + s.p.w / 2 - G.camX, gy = s.p.y + s.p.h - 50;
    ctx.fillStyle = `rgba(80, 40, 100, ${Math.min(0.28, t * 0.6)})`;
    ctx.fillRect(0, 0, W, VH);
    if (c.tier === 1 && t > 0.6) {
      for (let k = 0; k < 3; k++) {
        const r = (t - 0.6 - k * 0.22) * 650;
        if (r <= 0) continue;
        ctx.strokeStyle = `rgba(255, 236, 160, ${Math.max(0, 0.9 - r / 900)})`;
        ctx.lineWidth = 12 - k * 3;
        ctx.beginPath(); ctx.arc(gx, gy, r, -1.2, 1.2); ctx.stroke();
      }
    }
    if (c.tier === 2 && t > 0.6) {
      const cx = W * 0.71, a = Math.min(1, (t - 0.6) * 2.5);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(cx, GY);
      ctx.scale(1, 0.24);
      ctx.rotate(t * 1.4);
      ctx.strokeStyle = '#ffe9a0'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(0, 0, 250, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 205, 0, Math.PI * 2); ctx.stroke();
      starPath(ctx, 0, 0, 205, 0); ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = a * 0.35;
      const g = ctx.createLinearGradient(0, 0, 0, GY);
      g.addColorStop(0, 'rgba(255,240,180,0)'); g.addColorStop(1, 'rgba(255,240,180,1)');
      ctx.fillStyle = g; ctx.fillRect(cx - 250, 0, 500, GY);
      ctx.globalAlpha = 1;
    }
    if (c.tier === 3 && t > 0.95 && t < 1.35) {
      ctx.fillStyle = `rgba(255, 255, 255, ${0.7 * (1 - (t - 0.95) / 0.4)})`;
      ctx.fillRect(0, 0, W, VH);
    }
    for (const m of c.mobs) {
      if (m.done) continue;
      const k = Math.min(1, Math.max(0, (t - m.appear) / 0.25));
      if (k <= 0) continue;
      const bounce = k < 1 ? 1 + Math.sin(k * Math.PI) * 0.3 : 1 + Math.sin(t * 8 + m.x) * 0.04;
      sprite(m.type, m.x, m.y + 4, m.type === 'king' ? 0.42 : 0.29, { sx: k * (2 - bounce), sy: k * bounce, flip: false });
    }
    drawFx(G.fxS);
    const ta = Math.min(1, t * 3);
    ctx.save();
    ctx.translate(W / 2, 150);
    ctx.scale(0.6 + ta * 0.4, 0.6 + ta * 0.4);
    ctx.globalAlpha = ta;
    text(ctx, TIER_NAME[c.tier], 0, 0, 34, { fill: '#fff', stroke: c.tier === 3 ? '#d94f7e' : c.tier === 2 ? '#7a4fd0' : '#2f9c7d', sw: 8 });
    if (c.bonus) text(ctx, `清场奖励 +${c.bonus}`, 0, 42, 20, { fill: '#ffe48a', stroke: '#5b2a45', sw: 5 });
    ctx.restore();
    if (t > 0.5) text(ctx, '点击屏幕跳过', W - 24 - safeR, VH - 26, 16, { align: 'right', fill: '#fff', stroke: '#5b2a45', sw: 4 });
  }

  // ===== 界面切换 =====
  const screens = ['scrTitle', 'scrSelect', 'scrPause', 'scrFail', 'scrResult'].map((id) => $('#' + id));
  const btnPause = $('#btnPause');
  function show(id) { for (const el of screens) el.hidden = el.id !== id; }

  function startLevel(i, auto) {
    G.idx = i;
    G.L = LEVELS[i];
    G.s = newRun(G.L, !auto && (G.fails[i] || 0) >= 2);
    G.auto = auto ? auto.slice() : null;
    G.acc = 0; G.pendingTap = false; G.clear = null;
    G.fxW.length = 0; G.fxS.length = 0; G.pops.length = 0;
    G.sqx = 1; G.sqy = 1; G.dieY = 0; G.comboPop = 0; G.lastCombo = 0; G.runAnim = 0;
    G.cat.x = G.s.p.x - 30; G.cat.y = G.s.p.y - 20; G.cat.mood = 'idle'; G.cat.moodT = 0; G.cat.bubbleT = 0;
    G.camX = 0;
    show(null);
    btnPause.hidden = false;
    G.mode = 'play';
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    Snd.init();
    Snd.startBgm();
  }
  function pauseGame() {
    if (G.mode !== 'play' && G.mode !== 'countdown') return;
    G.mode = 'paused';
    show('scrPause');
    btnPause.hidden = true;
    syncSoundLabels();
  }
  function resumeGame() {
    show(null);
    btnPause.hidden = false;
    G.mode = 'countdown';
    G.countdown = 3;
    G.lastCount = 4;
  }
  function goSelect() {
    G.mode = 'title';
    btnPause.hidden = true;
    renderCards();
    show('scrSelect');
  }
  function goTitle() {
    G.mode = 'title';
    btnPause.hidden = true;
    show('scrTitle');
  }

  function onDead() {
    G.mode = 'dying';
    G.dieT = 0;
    G.dieVy = G.s.cause === 'enemy' ? -420 : 0;
    G.cat.mood = 'worry'; G.cat.moodT = 9;
    Snd.sfx('fail');
  }
  function showFail() {
    const s = G.s, i = G.idx;
    G.mode = 'fail';
    btnPause.hidden = true;
    G.fails[i] = (G.fails[i] || 0) + 1;
    $('#failCode').textContent = `${G.L.code} ${G.L.name}`;
    const FAIL = {
      pit: ['掉进坑里了', '在坑边点一下起跳；距离不够时，在空中再点一下二段跳。'],
      enemy: ['被怪物撞到了', '从上方落下、踩在怪物头上就能打倒它；从侧面碰到会受伤。'],
      boss: ['被布丁王撞到了', '别急着跳：等它走近、猫咪喊“现在跳！”时再起跳，就能落在它头上。'],
    };
    const [title, tip] = FAIL[s.cause] || FAIL.enemy;
    $('#failTitle').textContent = title;
    $('#failTip').textContent = tip;
    $('#failEasy').hidden = G.fails[i] < 2;
    show('scrFail');
    setTimeout(() => $('#btnRetry').focus({ preventScroll: true }), 50);
  }

  // 三星目标（PRD 6.2：完成 = 1 星，每达成一项挑战 +1 星）
  const GOALS = {
    combo: (n, s) => [s.maxCombo >= n, `最高连击 ≥ ${n}（本次 ${s.maxCombo}）`],
    stars: (n, s) => [s.stars >= n, `收集星星 ≥ ${n}（本次 ${s.stars}）`],
    energy: (n, s) => [s.energy >= n, `魔法能量 ≥ ${n}（本次 ${Math.floor(s.energy)}）`],
    noHurt: (n, s) => [s.hurts === 0, `无伤通关（本次受击 ${s.hurts} 次）`],
    doorFirst: (n, s) => [s.doorFails === 0, `每扇门都一次选对（本次选错 ${s.doorFails} 次）`],
  };
  const evalGoals = (L, s) => L.goals.map(([k, n]) => GOALS[k](n, s));

  function finishLevel() {
    const s = G.s, L = G.L, i = G.idx;
    G.mode = 'result';
    G.fails[i] = 0;
    const goals = evalGoals(L, s);
    const stars = 1 + goals.filter(([ok]) => ok).length;
    const best = save.best[L.code] || { stars: 0, score: 0, combo: 0 };
    save.best[L.code] = { stars: Math.max(best.stars, stars), score: Math.max(best.score, s.score), combo: Math.max(best.combo, s.maxCombo) };
    save.unlocked = Math.max(save.unlocked, Math.min(LEVELS.length, i + 2));
    persist();
    Snd.sfx('win');
    $('#resCode').textContent = `${L.code} ${L.name}`;
    const checks = [[true, L.boss ? '打倒布丁王并完成清场' : '抵达终点并完成清场'], ...goals];
    $('#resChecks').innerHTML = checks.map(([ok, str]) => `<li class="${ok ? 'ok' : ''}">${str}</li>`).join('');
    const tier = G.clear ? ['', '基础', '华丽', '传奇'][G.clear.tier] : '—';
    const stats = [['分数', s.score], ['最高连击', s.maxCombo], ['魔法能量', Math.floor(s.energy)], ['清场', tier]];
    $('#resStats').innerHTML = stats.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
    const bs = document.querySelectorAll('.big-stars span');
    bs.forEach((el) => el.classList.remove('on'));
    bs.forEach((el, k) => { if (k < stars) setTimeout(() => { el.classList.add('on'); Snd.sfx('count', 1); }, 250 + k * 280); });
    const last = i >= LEVELS.length - 1;
    $('#btnNext').textContent = last ? '回到选关' : '下一关';
    show('scrResult');
    setTimeout(() => $('#btnNext').focus({ preventScroll: true }), 50);
  }

  function renderCards() {
    const box = $('#levelCards');
    box.innerHTML = '';
    LEVELS.forEach((L, i) => {
      const locked = i >= save.unlocked;
      const best = save.best[L.code];
      const n = best ? best.stars : 0;
      const b = document.createElement('button');
      b.className = 'card' + (locked ? ' locked' : '');
      b.disabled = locked;
      b.setAttribute('aria-label', `${L.code} ${L.name}${locked ? '（未解锁）' : ''}`);
      b.innerHTML = `<span class="num">${i + 1}</span><span class="name">${L.name}</span><span class="tag">${L.tag}</span>`
        + `<span class="stars"><b>${'★'.repeat(n)}</b>${'★'.repeat(3 - n)}</span>`
        + `<span class="best">${locked ? '通关上一关后解锁' : best ? `最佳 ${best.score} 分` : '未挑战'}</span>`;
      b.addEventListener('click', () => { Snd.init(); Snd.sfx('click'); startLevel(i); });
      box.appendChild(b);
    });
  }

  function syncSoundLabels() {
    const str = save.muted ? '声音：关' : '声音：开';
    $('#btnSound').textContent = str;
    $('#btnPauseSound').textContent = str;
  }

  // ===== 输入 =====
  function handleTap() {
    Snd.init();
    if (G.mode === 'play') G.pendingTap = true;
    else if (G.mode === 'clear' && G.clear.t > 0.5) G.clear.t = G.clear.dur;
    else if (G.mode === 'countdown') G.countdown = 0;
  }
  cv.addEventListener('pointerdown', (e) => { e.preventDefault(); handleTap(); });
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('keydown', (e) => {
    if (['Space', 'ArrowUp', 'KeyW', 'KeyZ', 'KeyJ'].includes(e.code)) {
      if (G.mode === 'play' || G.mode === 'clear' || G.mode === 'countdown') {
        e.preventDefault();
        if (!e.repeat) handleTap();
      }
    } else if (e.code === 'Escape' || e.code === 'KeyP') {
      if (G.mode === 'play') pauseGame();
      else if (G.mode === 'paused') resumeGame();
    }
  });
  btnPause.addEventListener('click', () => { Snd.sfx('click'); pauseGame(); });
  $('#btnStart').addEventListener('click', () => {
    Snd.init(); Snd.sfx('click');
    const next = LEVELS.findIndex((L) => !save.best[L.code]);
    startLevel(next < 0 ? 0 : Math.min(next, save.unlocked - 1));
  });
  $('#btnSelect').addEventListener('click', () => { Snd.init(); Snd.sfx('click'); goSelect(); });
  $('#btnBack').addEventListener('click', () => { Snd.sfx('click'); goTitle(); });
  $('#btnUnlock').addEventListener('click', () => { save.unlocked = LEVELS.length; persist(); renderCards(); });
  $('#btnResume').addEventListener('click', () => { Snd.sfx('click'); resumeGame(); });
  $('#btnRestart').addEventListener('click', () => { Snd.sfx('click'); startLevel(G.idx); });
  $('#btnPauseMenu').addEventListener('click', () => { Snd.sfx('click'); Snd.stopBgm(); goSelect(); });
  $('#btnRetry').addEventListener('click', () => { Snd.sfx('click'); startLevel(G.idx); });
  $('#btnFailMenu').addEventListener('click', () => { Snd.sfx('click'); goSelect(); });
  $('#btnReplay').addEventListener('click', () => { Snd.sfx('click'); startLevel(G.idx); });
  $('#btnResMenu').addEventListener('click', () => { Snd.sfx('click'); goSelect(); });
  $('#btnNext').addEventListener('click', () => {
    Snd.sfx('click');
    if (G.idx >= LEVELS.length - 1) goSelect(); else startLevel(G.idx + 1);
  });
  const toggleSound = () => { Snd.init(); Snd.setMuted(!save.muted); syncSoundLabels(); Snd.sfx('click'); };
  $('#btnSound').addEventListener('click', toggleSound);
  $('#btnPauseSound').addEventListener('click', toggleSound);

  // 切后台、失焦、竖屏时自动暂停
  document.addEventListener('visibilitychange', () => {
    if (G.auto) return;
    if (document.hidden) { pauseGame(); if (Snd.ctx) Snd.ctx.suspend(); }
    else if (Snd.ctx && Snd.playing) Snd.ctx.resume();
  });
  window.addEventListener('blur', () => { if (!G.auto) pauseGame(); });
  function checkOrientation() {
    const portrait = coarse && window.innerHeight > window.innerWidth;
    $('#scrRotate').hidden = !portrait;
    if (portrait) pauseGame();
  }
  window.addEventListener('resize', resize);

  // ===== 主循环 =====
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    // 先预约下一帧，单帧出错也不会让游戏永久停住
    requestAnimationFrame(frame);
    update(dt);
    if (scale > 0) render();
  }

  function update(dt) {
    G.time += dt;
    const s = G.s;
    if (G.mode === 'play' || G.mode === 'clear') {
      G.acc += dt;
      let n = 0;
      while (G.acc >= DT && n < 30) {
        let tap = G.pendingTap;
        G.pendingTap = false;
        if (G.auto && G.auto.length && s.n === G.auto[0]) { tap = true; G.auto.shift(); }
        step(G.L, s, tap);
        handleEvents();
        G.acc -= DT;
        n++;
        if (s.dead || (G.mode === 'play' && s.finished)) break;
      }
      if (G.mode === 'play') {
        if (s.dead) onDead();
        else if (s.finished) startClear();
      }
      const moved = s.p.x - G.prevX;
      G.prevX = s.p.x;
      if (s.p.onGround && moved > 0.05 && moved < 20) G.runAnim += moved / CFG.runSpeed;
      G.idleT = s.p.onGround && moved <= 0.05 ? G.idleT + dt : 0;
    } else if (G.mode === 'countdown') {
      G.countdown -= dt;
      const c = Math.ceil(G.countdown);
      if (c < G.lastCount && c > 0) { Snd.sfx('count', 0); G.lastCount = c; }
      if (G.countdown <= 0) { G.mode = 'play'; G.acc = 0; Snd.sfx('count', 1); }
    } else if (G.mode === 'dying') {
      G.dieT += dt;
      if (s.cause === 'enemy') { G.dieVy += 1400 * dt; G.dieY += G.dieVy * dt; }
      if (G.dieT > 0.9) showFail();
    } else if (G.mode === 'title') {
      G.camX = (G.camX + 46 * dt) % 4800;
    }
    if (G.mode === 'clear') updateClear(dt);
    if (s && G.mode !== 'title') G.camX = Math.max(0, s.p.x - W * 0.3);

    // 渲染侧的缓动
    if (G.mode !== 'paused') {
      updateFx(G.fxW, dt);
      updateFx(G.fxS, dt);
      for (let i = G.pops.length - 1; i >= 0; i--) { G.pops[i].life -= dt; if (G.pops[i].life <= 0) G.pops.splice(i, 1); }
      G.sqx += (1 - G.sqx) * Math.min(1, dt * 12);
      G.sqy += (1 - G.sqy) * Math.min(1, dt * 12);
      G.comboPop = Math.max(0, G.comboPop - dt * 4);
      G.flash = Math.max(0, G.flash - dt);
      G.shake = Math.max(0, G.shake - dt);
      G.cat.moodT -= dt;
      if (G.cat.moodT <= 0) G.cat.mood = 'idle';
      G.cat.bubbleT -= dt;
      if (s && G.mode !== 'title') {
        const tx = s.p.x - 38, ty = s.p.y - 16 + Math.sin(G.time * 3) * 5;
        G.cat.x += (tx - G.cat.x) * Math.min(1, dt * 6);
        G.cat.y += (ty - G.cat.y) * Math.min(1, dt * 6);
      }
    }
  }

  function render() {
    const k = scale * dpr;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.imageSmoothingQuality = 'high';
    drawBackground(G.camX);
    const inGame = G.mode !== 'title';
    const sh = G.shake > 0 ? Math.sin(G.time * 90) * 6 * (G.shake / 0.35) : 0;
    ctx.save();
    ctx.translate(-Math.round(G.camX * k) / k + sh, sh * 0.5);
    drawWorld(G.L, inGame ? G.s : null);
    ctx.restore();
    if (!inGame || !G.s) return;
    if (G.flash > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(0.85, G.flash * 2)})`;
      ctx.fillRect(0, 0, W, VH);
    }
    if (G.mode === 'clear') drawClear();
    else if (G.mode !== 'result') drawHUD();
    if (G.mode === 'countdown') {
      const c = Math.max(1, Math.ceil(G.countdown)), f = G.countdown % 1;
      ctx.fillStyle = 'rgba(70, 30, 60, 0.25)'; ctx.fillRect(0, 0, W, VH);
      ctx.save(); ctx.translate(W / 2, VH / 2 - 20); ctx.scale(1 + f * 0.3, 1 + f * 0.3);
      text(ctx, `${c}`, 0, 0, 96, { fill: '#fff', stroke: '#d94f7e', sw: 10 });
      ctx.restore();
      text(ctx, '点击屏幕立即继续', W / 2, VH / 2 + 60, 18, { fill: '#fff', stroke: '#5b2a45', sw: 4 });
    }
  }

  // ===== 自动求解：验证每关可通（调试用，不影响正常游玩） =====
  function solve(idx, opt = {}) {
    const L = LEVELS[idx];
    const root = newRun(L, false);
    root.ev = null;
    const D = 6, H = 160, LIMIT = opt.limit || 300000;
    const goalN = (name) => (L.goals.find((g) => g[0] === name) || [])[1] || 0;
    const needCombo = opt.combo ? goalN('combo') : 0, needStars = opt.stars ? goalN('stars') : 0;
    const ok = (s) => s.finished && s.maxCombo >= needCombo && s.stars >= needStars;
    const bad = (s) => s.dead || s.hurts > 0 || s.doorFails > 0 || (s.finished && !ok(s));
    const key = (s) => {
      const p = s.p;
      let k = `${Math.round(p.x / 4)},${Math.round(p.y / 4)},${Math.round(p.vy / 30)},${p.air},${p.onGround ? 1 : 0},${p.stompT > 0 ? 1 : 0},${s.cat.phase}`;
      for (const e of s.en) k += e.alive ? '1' : '0';
      k += `|${s.seals.join('')}${s.doorDone.join('')}`;
      if (s.boss) {
        const b = s.boss;
        k += `|${b.state},${b.hp},${Math.round(b.x / 4)},${b.spawnLeft},${Math.round(b.t * 10)}`;
        for (const e of s.en) if (e.minion && e.alive) k += `,${Math.round(e.x / 4)}`;
      }
      if (needCombo) k += `,${s.combo},${Math.ceil(s.comboT * 4)},${s.maxCombo >= needCombo ? 1 : 0}`;
      if (needStars) k += `,${Math.min(s.stars, needStars)}`;
      return k;
    };
    const seen = new Set();
    let nodes = 0;
    // 尽量不点：先沿"不点击"走到视野尽头，走不通再从最晚的决策点开始尝试点击
    function dfs(s, taps) {
      if (++nodes > LIMIT) return null;
      const k = key(s);
      if (seen.has(k)) return null;
      seen.add(k);
      const cur = cloneRun(s), points = [];
      let alive = true;
      for (let i = 0; i <= H; i++) {
        if (ok(cur)) return taps;
        if (i % D === 0) points.push(cloneRun(cur));
        step(L, cur, false);
        if (bad(cur)) { alive = false; break; }
      }
      if (alive) {
        const r = dfs(cur, taps);
        if (r) return r;
      }
      for (let j = points.length - 1; j >= 0; j--) {
        if (nodes > LIMIT) return null;
        const b = cloneRun(points[j]), n = b.n;
        step(L, b, true);
        if (bad(b)) continue;
        const r = dfs(b, taps.concat(n));
        if (r) return r;
      }
      return null;
    }
    const taps = dfs(root, []);
    let result = null;
    if (taps) {
      const s = newRun(L, false);
      s.ev = null;
      const q = taps.slice();
      while (!s.finished && !s.dead && s.n < 120 * 120) {
        const tap = q.length && s.n === q[0];
        if (tap) q.shift();
        step(L, s, tap);
      }
      result = { finished: s.finished, seconds: +s.t.toFixed(1), score: s.score, maxCombo: s.maxCombo, stars: s.stars, energy: s.energy, taps: taps.length };
    }
    return { ok: !!taps, nodes, result, taps };
  }
  // 调试：不依赖 requestAnimationFrame 手动快进（页面在后台时用于截图验证）
  function tick(sec) { for (let t = 0; t < sec; t += 1 / 60) update(1 / 60); render(); return G.mode; }
  window.__mmq = { solve, autoplay: (i, taps) => startLevel(i, taps), tick, G, LEVELS, CFG, step, newRun, jumpCue };

  // ===== 启动 =====
  syncSoundLabels();
  resize();
  const fontReady = document.fonts && document.fonts.load ? document.fonts.load(`20px "ZCOOL KuaiLe"`, '魔法连击终点0123') : Promise.resolve();
  Promise.race([Promise.all([assetsReady, fontReady]), new Promise((r) => setTimeout(r, 4000))]).then(() => {
    requestAnimationFrame((t) => { last = t; frame(t); });
  });
})();
</script>
